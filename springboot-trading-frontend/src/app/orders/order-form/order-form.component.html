<h3 class="media-heading">{{ (editMode$ | async) ? 'Edit Order' : 'Open Order' }}</h3>
<hr>
<div class="row">
  <div class="col-xs-12">
    <form [formGroup]="getOrderForm()" class="order-form">
      <div class="order-form__grid order-form__grid--top">
        <div class="order-form__cell order-form__cell--2">
          <label for="id">ID</label>
          <input type="number" id="id" formControlName="id" class="form-control" />
        </div>
        <div class="order-form__cell order-form__cell--2">
          <label for="action">Action</label>
          <select id="action" formControlName="action" class="form-control">
            <option value="BUY">Buy</option>
            <option value="SELL">Sell</option>
          </select>
        </div>
        <div class="order-form__cell order-form__cell--2">
          <label for="totalQuantity">Quantity</label>
          <input type="number" id="totalQuantity" formControlName="totalQuantity" class="form-control" />
        </div>
        <div class="order-form__cell order-form__cell--2">
          <label for="orderType">Order type</label>
          <input type="text" id="orderType" formControlName="orderType" class="form-control" />
        </div>
        <div class="order-form__cell order-form__cell--2">
          <label for="limitPrice">Limit price</label>
          <input type="number" id="limitPrice" formControlName="limitPrice" class="form-control" />
        </div>
        <div class="order-form__cell order-form__cell--2">
          <label for="timeInForce">TIF</label>
          <input type="text" id="timeInForce" formControlName="timeInForce" class="form-control" />
        </div>
      </div>

      <h4 class="order-form__section-title">Contract data</h4>

      <div formGroupName="contractDBO" class="order-form__contract">
        <div class="order-form__grid">
          <div class="order-form__cell order-form__cell--2">
            <label for="contractId">Contract ID</label>
            <input type="number" id="contractId" formControlName="contractId" class="form-control" />
          </div>
          <div class="order-form__cell order-form__cell--2">
            <label for="symbol">Symbol</label>
            <input type="text" id="symbol" formControlName="symbol" class="form-control" />
          </div>
          <div class="order-form__cell order-form__cell--2">
            <label for="securityType">Sec type</label>
            <input type="text" id="securityType" formControlName="securityType" class="form-control" />
          </div>
          <div class="order-form__cell order-form__cell--2">
            <label for="currency">Currency</label>
            <input type="text" id="currency" formControlName="currency" class="form-control" />
          </div>
          <div class="order-form__cell order-form__cell--4">
            <label for="exchange">Exchange</label>
            <input type="text" id="exchange" formControlName="exchange" class="form-control" />
          </div>
        </div>

        <div class="order-form__deriv">
          <h5 class="order-form__deriv-title">For derivatives</h5>
          <div class="order-form__grid">
            <div class="order-form__cell order-form__cell--3">
              <label for="lastTradeDate">Last trade date</label>
              <input type="text" id="lastTradeDate" formControlName="lastTradeDate" class="form-control" />
            </div>
            <div class="order-form__cell order-form__cell--2">
              <label for="strike">Strike</label>
              <input type="number" id="strike" formControlName="strike" class="form-control" />
            </div>
            <div class="order-form__cell order-form__cell--2">
              <label for="right">Put / call</label>
              <select id="right" formControlName="right" class="form-control">
                <option value="None">None</option>
                <option value="Call">Call</option>
                <option value="Put">Put</option>
              </select>
            </div>
            <div class="order-form__cell order-form__cell--5">
              <label for="tradingClass">Trading class</label>
              <input type="text" id="tradingClass" formControlName="tradingClass" class="form-control" />
            </div>
          </div>
          <div class="order-form__grid order-form__grid--tight-top">
            <div class="order-form__cell order-form__cell--12">
              <label for="localSymbol">Local symbol</label>
              <input type="text" id="localSymbol" formControlName="localSymbol" class="form-control" />
            </div>
          </div>
        </div>

        <router-outlet></router-outlet>

        <hr class="order-form__hr" />
        <div class="order-form__actions">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="!isFormValid() || !isFormTouched()"
            (click)="onSubmit()">
            {{ (editMode$ | async) ? 'Update Order' : 'Place Order' }}
          </button>
          <button
            type="button"
            class="btn btn-default"
            *ngIf="!(editMode$ | async) && !(strategyMode$ | async)"
            (click)="onStrategyBuilder()">
            Strategy Builder
          </button>
          <button type="button" class="btn btn-default" *ngIf="strategyMode$ | async" (click)="onStandardOrder()">
            Standard Order
          </button>
          <button
            type="button"
            class="btn btn-danger"
            (click)="onCancel()"
            title="Clear all fields in this form and start over">
            Clear form
          </button>
          <button type="button" class="btn btn-default order-form__actions-spacer-before" (click)="onMarketData()">
            Market Data for Contract
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
<div class="row order-form__market-row">
  <div class="col-xs-12 col-md-10">
    <app-order-market-data *ngIf="contract" [contract]="contract"></app-order-market-data>
  </div>
</div>
