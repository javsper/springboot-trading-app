<div class="open-order-item" *ngIf="order">
  <div class="open-order-item__toolbar">
    <button class="btn btn-danger btn-sm" type="button" (click)="onCancelOrder()">Cancel order</button>
  </div>
  <a
    class="list-group-item clearfix open-order-item__body"
    [routerLink]="[order.id]"
    routerLinkActive="active">
    <div class="open-order-item__row">
      <div class="open-order-item__main">
        <h4 class="list-group-item-heading">{{ order.contractData.localSymbol }}</h4>
        <div class="open-order-item__meta">
          <p class="list-group-item-text">Limit: {{ order.limitPrice }}</p>
          <p class="list-group-item-text">Qty: {{ order.totalQuantity }}</p>
          <p class="list-group-item-text">TIF: {{ order.timeInForce }}</p>
          <p class="list-group-item-text">Status: {{ order.status }}</p>
        </div>
      </div>
    </div>
  </a>
</div>
